---
- name: Capture existing netplan configurations
  ansible.builtin.find:
    paths: /etc/netplan
    patterns: "*.yml,*.yaml"
  register: _netplan_configs

- name: Debug existing netplan configurations
  ansible.builtin.debug:
    var: _netplan_configs
  when: debug is defined and (debug | bool)

- name: Backup existing configurations
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item['path'] }}"
    dest: "{{ item['path'] }}.bk"
    mode: "0600"
  with_items: "{{ _netplan_configs['files'] }}"
  when:
    - netplan_backup_existing
    - item['path'] != netplan_config_file
    - netplan_configuration != []

- name: Remove existing configurations
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    state: absent
  become: true
  with_items: "{{ _netplan_configs['files'] }}"
  when:
    - item['path'] != netplan_config_file
    - netplan_configuration != []
