---
# defaults file for ansible-netplan
netplan_config_file: /etc/netplan/ansible-config.yaml

# File permissions for netplan config file.
netplan_config_file_mode: '0600'

# switch to enable/disable the role completely
netplan_enabled: true

# Configured devices get handled by systemd-networkd by default, unless explicitly marked as managed by a specific renderer (NetworkManager)
netplan_renderer:

netplan_default_configuration_raw: |
  network:
    version: 2
  {% if netplan_renderer is not none %}
    renderer: {{ netplan_renderer }}
  {% endif %}

netplan_default_configuration: "{{ netplan_default_configuration_raw | from_yaml }}"

netplan_configuration:
  {}
  # network:
  #   version: 2
  #   ethernets:
  #     enp0s3:
  #       dhcp4: true
  #     enp0s8:
  #       addresses:
  #         - 192.168.250.10/24
  #         - 192.168.250.11/24
  #       nameservers:
  #         addresses:
  #           - 10.0.2.3
  #           - 8.8.8.8
  #           - 8.8.4.4
  #         search:
  #           # Custom variable
  #           - "{{ netplan_pri_domain }}"
  #       gateway4: 192.168.250.1
  #       optional: true
  #       routes:
  #         - to: 0.0.0.0/0
  #           via: 9.9.9.9
  #           on-link: true
  #         - to: 192.168.5.0/24
  #           via: 192.168.5.1
  #           table: 102
  #       routing-policy:
  #         - from: 192.168.5.0/24
  #           table: 102
  #     lo:
  #       match:
  #         name: lo
  #       addresses: [7.7.7.7/32]
  #   wifis:
  #     wlp2s0b1:
  #       dhcp4: no
  #       dhcp6: no
  #       addresses: [192.168.0.21/24]
  #       gateway4: 192.168.0.1
  #       access-points:
  #         "network_ssid_name":
  #           password: "**********"
  #   bonds:
  #     bond0:
  #       dhcp4: yes
  #       interfaces:
  #         - enp0s3
  #         - enp4s0
  #       parameters:
  #         # modes can be one of balance-rr, active-backup, balance-xor, broadcast,
  #         # 802.3ad, balance-tlb, and balance-alb.
  #         mode: active-backup
  #         primary: enp0s3
  #   bridges:
  #     # br0:
  #     #   dhcp4: yes
  #     #   interfaces:
  #     #     - enp0s3
  #     br0:
  #       addresses: [10.3.99.25/24]
  #       interfaces: [vlan15]
  #   vlans:
  #     vlan15:
  #       accept-ra: no
  #       id: 15
  #       link: enp0s25

netplan_remove_existing: false

netplan_backup_existing: false

netplan_packages:
  - netplan.io

netplan_pri_domain: example.org

netplan_check_install: True

netplan_apply: True

# Blacklist the e1000e driver via /etc/modprobe.d and trigger update-initramfs.
# Use this when the Intel NIC firmware hang is so frequent that the watchdog is
# not sufficient and the driver must be disabled entirely.
netplan_blacklist_e1000e: false

# Deploy a NIC watchdog script + systemd timer (every 5 min) that checks
# journalctl for "Detected Hardware Unit Hang", pings the default gateway,
# and reboots if the gateway is unreachable. Mutually exclusive with
# netplan_blacklist_e1000e: when the blacklist is enabled the watchdog is
# removed because the driver is gone.
netplan_enable_nic_watchdog: false

# Wrap the netplan apply step in a block/rescue that restores the original
# 50-cloud-init.yaml backup if the apply fails and SSH drops. Default true
# because it is purely defensive and safe for remote hosts.
netplan_enable_recovery: true
